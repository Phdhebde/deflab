name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-docs.txt

      # Source unique de vérité : les write-ups sont recopiés depuis modules/,
      # jamais dupliqués dans le dépôt.
      - name: Synchroniser les write-ups
        run: python tools/sync_docs.py

      - name: Déployer sur GitHub Pages
        run: mkdocs gh-deploy --force
